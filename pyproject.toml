[project]
name = "manifold"
version = "0.3.23"
description = "Light and Robust Web3 Multicall"
authors = [{ name = "Tony Rocco Valentine", email = "tonyroccovalentine@protonmail.com" }]
requires-python = ">=3.10,<4"
readme = "README.md"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "aiohttp>=3.8.4,<4",
    # pip does not read [tool.uv.sources]: without the URL here, pip installs
    # the unrelated "pysad" project from PyPI.
    "pysad @ git+https://github.com/Dedaub/pySAD.git@f90ad18ff4598b9b8657d667692a824b0f2ace69",
    # 0.18.6 is the first msgspec with wheels for Python 3.12. msgspec 0.15
    # does not compile on Python 3.12 or later.
    "msgspec>=0.18.6,<1",
    # manifold/log.py imports rich
    "rich>=13.4.2",
]

[dependency-groups]
dev = [
    "pytest>=7.3.1,<8",
    "pytest-memray>=1.4.0,<2",
    "pyinstrument>=4.4.0,<5",
    "mypy>=1.3.0,<2",
]

[tool.uv]

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"
